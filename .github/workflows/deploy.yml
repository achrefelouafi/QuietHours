name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # tools/build.js has no dependencies; node-canvas (for previews) is not needed here.
      - name: Build
        run: node tools/build.js

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # No npm install step, so the action can't detect the version from
          # node_modules and would fall back to wrangler 3.x, which doesn't
          # read wrangler.jsonc. Match the major pinned in package.json.
          wranglerVersion: "4"
          command: deploy

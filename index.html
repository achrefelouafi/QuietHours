<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>quiet hours</title>
<style>
  :root{ --bg:#050b14; --ink:#8ea0b8; --dim:#3f5170; --amber:#e6a24a; }
  *{box-sizing:border-box}
  html,body{ margin:0; padding:0; background:var(--bg); height:100%; overflow:hidden; overscroll-behavior:none; }
  body{
    color:var(--ink);
    font:400 12px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
  }
  /* the page never scrolls — the canvas is the whole viewport and the camera does the moving */
  #stage{ position:fixed; left:0; top:0; width:100%; height:100%; display:block; image-rendering:pixelated; touch-action:none; cursor:grab; outline:none; }
  #stage.drag{cursor:grabbing}
  #stage.hot{cursor:pointer}
  #stage:focus-visible{outline:2px solid var(--amber); outline-offset:-4px}
  .slate{ position:fixed; left:18px; top:16px; pointer-events:none; letter-spacing:.06em; color:var(--dim); }
  .slate b{display:block; color:var(--ink); font-weight:400; font-size:13px}
  .slate span{white-space:pre-line}
  .hint{ position:fixed; right:18px; bottom:14px; margin:0; color:var(--dim); letter-spacing:.04em; text-align:right; pointer-events:none; }
  @media (max-width:640px){ .slate{left:12px; top:12px} .hint{right:12px; bottom:10px; font-size:11px} }
</style>
</head>
<body>
<canvas id="stage" tabindex="0"
        aria-label="Two isometric pixel-art rooms at night, one stacked on the other: downstairs a desk lamp lights a desk under a rain-streaked window; upstairs a bedside lamp and a neon sign light a bedroom. Drag to look around, scroll to zoom, press 1 or 2 to fly to a room, click a lamp to switch it off and on, click the bedroom blind to run it down over the window and back up."></canvas>
<div class="slate"><b>quiet hours</b><span id="state">room one · lamp on
room two · lamp on</span></div>
<p class="hint">drag to look around · scroll to zoom · 1 / 2 fly to a room · click a lamp · click the blind</p>

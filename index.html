<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>quiet hours — room one</title>
<style>
  :root{ --bg:#0e1420; --ink:#8ea0b8; --dim:#3f5170; --amber:#e6a24a; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:400 12px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  main{position:relative; width:100%; height:100%}
  canvas{ display:block; width:100%; height:100%; image-rendering:pixelated; touch-action:none; }
  canvas.hot{cursor:pointer}
  canvas:focus-visible{outline:2px solid var(--amber); outline-offset:-4px}
  .slate{ position:absolute; left:18px; top:16px; pointer-events:none; letter-spacing:.06em; color:var(--dim); }
  .slate b{display:block; color:var(--ink); font-weight:400; font-size:13px}
  .hint{ position:absolute; right:18px; bottom:14px; margin:0; color:var(--dim); letter-spacing:.04em; text-align:right; pointer-events:none; }
  @media (max-width:640px){ .slate{left:12px; top:12px} .hint{right:12px; bottom:10px; font-size:11px} }
</style>
</head>
<body>
<main>
  <canvas id="stage" tabindex="0"
          aria-label="An isometric pixel-art bedroom at night: a desk lamp lights a desk under a rain-streaked window. Click the lamp to switch it off and on."></canvas>
  <div class="slate"><b>quiet hours</b><span id="state">lamp on</span></div>
  <p class="hint">click the lamp</p>
</main>

<script>
(() => {
'use strict';

/* ════════════════════════════════════════════════════════════════
   QUIET HOURS — room one
   One room, drawn with an isometric software painter at a low
   resolution and snapped to a fixed set of inks, so it reads as
   pixel art rather than a render.

   Layout of this file:
     1  inks + quantiser
     2  camera + isometric projection
     3  drawing primitives
     4  the room (all the actual content lives here)
     5  light
     6  compositing, input, loop
   ════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;

/* ─────────────────────────────────────────────
   1. INKS
   Every colour that reaches the screen is one of
   these. Navy for the room, orange for everything
   the lamp touches, a little green for the plants.
   ───────────────────────────────────────────── */
const INK = [
  [14, 20, 32],    //  0 outside
  [20, 28, 42],    //  1 floor line / deep shadow
  [26, 36, 52],    //  2 floor
  [32, 44, 62],    //  3 wall
  [40, 54, 76],    //  4 furniture dark
  [52, 68, 94],    //  5 furniture
  [68, 88, 118],   //  6 furniture light / trim
  [92, 116, 148],  //  7 slate
  [128, 150, 176], //  8 pale slate
  [176, 186, 196], //  9 grey
  [224, 222, 212], // 10 cream
  [94, 52, 26],    // 11 orange, in shadow
  [138, 76, 32],   // 12 rust
  [180, 100, 40],  // 13 orange
  [214, 128, 52],  // 14 bright orange
  [240, 168, 84],  // 15 amber
  [255, 208, 120], // 16 lamp
  [255, 238, 190], // 17 lamp core
  [40, 96, 76],    // 18 leaf dark
  [60, 136, 104],  // 19 leaf
  [96, 180, 138],  // 20 leaf light
  [10, 14, 24],    // 21 night sky
  [24, 32, 52],    // 22 city
  [58, 90, 128],   // 23 rain / screen
  [110, 160, 210], // 24 screen text
  [66, 44, 38],    // 25 wood, in shadow
  [116, 74, 46],   // 26 wood
  [166, 122, 78],  // 27 wood, lit
  [82, 94, 110],   // 28 metal
  [150, 62, 50],   // 29 red spine
  [206, 170, 118], // 30 tan spine
];

const PAL32 = new Uint32Array(INK.length);
INK.forEach((c, i) => { PAL32[i] = (255 << 24) | (c[2] << 16) | (c[1] << 8) | c[0]; });

// 15-bit RGB → nearest ink. 32k entries, built once.
const LUT = new Uint8Array(32768);
(function buildLUT() {
  for (let r = 0; r < 32; r++)
  for (let g = 0; g < 32; g++)
  for (let b = 0; b < 32; b++) {
    const R = (r << 3) | 4, G = (g << 3) | 4, B = (b << 3) | 4;
    let best = 0, bd = Infinity;
    for (let i = 0; i < INK.length; i++) {
      const c = INK[i];
      const dr = R - c[0], dg = G - c[1], db = B - c[2];
      const d = dr * dr + dg * dg + db * db;
      if (d < bd) { bd = d; best = i; }
    }
    LUT[(r << 10) | (g << 5) | b] = best;
  }
})();

// 8×8 ordered (Bayer) threshold matrix. Used lightly — just enough
// that the lamp falloff breaks into pixels instead of bands.
const BAYER = new Int16Array([
   0,32, 8,40, 2,34,10,42,  48,16,56,24,50,18,58,26,
  12,44, 4,36,14,46, 6,38,  60,28,52,20,62,30,54,22,
   3,35,11,43, 1,33, 9,41,  51,19,59,27,49,17,57,25,
  15,47, 7,39,13,45, 5,37,  63,31,55,23,61,29,53,21,
]);

function ditherToInks(img, w, h, spread) {
  const d = img.data;
  const out = new Uint32Array(d.buffer);
  for (let y = 0; y < h; y++) {
    const brow = (y & 7) << 3;
    for (let x = 0; x < w; x++) {
      const i = y * w + x, p = i << 2;
      const o = (BAYER[brow | (x & 7)] * (1 / 63) - 0.5) * spread;
      let r = d[p] + o, g = d[p + 1] + o, b = d[p + 2] + o;
      r = r < 0 ? 0 : r > 255 ? 255 : r;
      g = g < 0 ? 0 : g > 255 ? 255 : g;
      b = b < 0 ? 0 : b > 255 ? 255 : b;
      out[i] = PAL32[LUT[((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3)]];
    }
  }
}

/* ─────────────────────────────────────────────
   2. CAMERA + PROJECTION
   2:1 isometric. The camera sits at +x +y +z, so the
   faces you can see on any solid are the ones whose
   normals point +x, +y and +z.
   ───────────────────────────────────────────── */
const BASE = { tw: 18, th: 9, tz: 16 };
const cam  = { x: 0, y: 0, z: 1 };

let g;               // the 2D context we're painting into
let LAMP = 1;        // 0..1, how much the lamp is giving

function P(x, y, z) {
  const tw = BASE.tw * cam.z, th = BASE.th * cam.z, tz = BASE.tz * cam.z;
  return [(x - y) * tw + cam.x, (x + y) * th - z * tz + cam.y];
}

/* ─────────────────────────────────────────────
   3. PRIMITIVES
   ───────────────────────────────────────────── */
const rgb = c => 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

/** Shade a colour by a factor. */
function sh(c, k) {
  return rgb([clamp(c[0] * k, 0, 255), clamp(c[1] * k, 0, 255), clamp(c[2] * k, 0, 255)]);
}

// face brightness: top catches the most, the +x (screen-right) face the least
const F_TOP = 1.00, F_LEFT = 0.80, F_RIGHT = 0.62;

/** A flat polygon in world space. pts = [[x,y,z], …] */
function poly(pts, fill) {
  g.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const p = P(pts[i][0], pts[i][1], pts[i][2]);
    if (i) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]);
  }
  g.closePath();
  g.fillStyle = fill;
  g.fill();
}

/** Axis-aligned box: its +y face (screen-left), +x face (screen-right), then the top. */
function box(x, y, z, w, d, h, col, o = {}) {
  const t = o.top !== undefined ? o.top : F_TOP;
  const l = o.left !== undefined ? o.left : F_LEFT;
  const r = o.right !== undefined ? o.right : F_RIGHT;
  const cT = o.colTop || col, cL = o.colLeft || col, cR = o.colRight || col;
  if (h > 0) {
    poly([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]], sh(cL, l));
    poly([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]], sh(cR, r));
  }
  poly([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], sh(cT, t));
  // a one-pixel dark contour round the top and down the front corner —
  // the thing that makes a box read as pixel art instead of a render
  if (o.edge !== false && w > 0.25 && d > 0.25) {
    g.strokeStyle = sh(cT, 0.55);
    g.lineWidth = 1;
    g.lineCap = 'butt';
    g.beginPath();
    [[x, y], [x + w, y], [x + w, y + d], [x, y + d]].forEach(([px, py], i) => {
      const p = P(px, py, z + h); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]);
    });
    g.closePath();
    if (h > 0.25) { const a = P(x + w, y + d, z + h), b = P(x + w, y + d, z); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); }
    g.stroke();
  }
}

/** Rectangle on the left wall plane (x = const), facing +x. */
function rectX(x, y0, z0, y1, z1, fill) {
  poly([[x, y0, z0], [x, y1, z0], [x, y1, z1], [x, y0, z1]], fill);
}
/** Rectangle on the back-right wall plane (y = const), facing +y. */
function rectY(y, x0, z0, x1, z1, fill) {
  poly([[x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1]], fill);
}

/** Circle lying flat. */
function disc(cx, cy, z, r, fill, n = 20) {
  const pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * TAU; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a), z]); }
  poly(pts, fill);
}
/** Circle standing on a y = const plane. */
function discY(cx, y, cz, r, fill, n = 22) {
  const pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * TAU; pts.push([cx + r * Math.cos(a), y, cz + r * Math.sin(a)]); }
  poly(pts, fill);
}
/** Circle standing on an x = const plane. */
function discX(x, cy, cz, r, fill, n = 22) {
  const pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * TAU; pts.push([x, cy + r * Math.cos(a), cz + r * Math.sin(a)]); }
  poly(pts, fill);
}

/** Cylinder / truncated cone. Only the camera-facing segments get drawn. */
function cyl(cx, cy, z, r, h, col, o = {}) {
  const n = o.n || 18, rt = o.rt !== undefined ? o.rt : r;
  for (let i = 0; i < n; i++) {
    const a0 = i / n * TAU, a1 = (i + 1) / n * TAU, am = (a0 + a1) / 2;
    const nx = Math.cos(am), ny = Math.sin(am);
    if (nx + ny <= 0) continue;                       // facing away
    const k = lerp(F_RIGHT, F_LEFT, clamp((ny - nx) * 0.5 + 0.5, 0, 1)) * (o.side || 1);
    poly([
      [cx + r  * Math.cos(a0), cy + r  * Math.sin(a0), z],
      [cx + r  * Math.cos(a1), cy + r  * Math.sin(a1), z],
      [cx + rt * Math.cos(a1), cy + rt * Math.sin(a1), z + h],
      [cx + rt * Math.cos(a0), cy + rt * Math.sin(a0), z + h],
    ], sh(col, k));
  }
  if (o.top !== false) disc(cx, cy, z + h, rt, sh(col, o.topK || F_TOP), n);
}

/** A thick line between two world points. Width is in world units. */
function beam(a, b, width, col, k = 0.8) {
  const p1 = P(a[0], a[1], a[2]), p2 = P(b[0], b[1], b[2]);
  g.strokeStyle = sh(col, k);
  g.lineWidth = Math.max(1, width * BASE.tw * cam.z);
  g.lineCap = 'round';
  g.beginPath(); g.moveTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.stroke();
}

/* Deterministic noise, so speckle doesn't crawl between frames. */
function rnd(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/** Scatter flecks across a floor region. */
function speckle(x0, y0, w, d, count, col, seed, size = 0.06) {
  const R = rnd(seed);
  g.fillStyle = sh(col, 1);
  for (let i = 0; i < count; i++) {
    const p = P(x0 + R() * w, y0 + R() * d, 0.01);
    const s = Math.max(1, size * BASE.tw * cam.z);
    g.fillRect(p[0], p[1], s, s);
  }
}

/* ─────────────────────────────────────────────
   4. THE ROOM
   ───────────────────────────────────────────── */
const RW = 14, RD = 14, WH = 9, WT = 0.4;   // floor 14×14, walls 9 high, 0.4 thick

const M = {
  floor:  [26, 36, 52],
  line:   [20, 28, 42],
  wallL:  [31, 42, 60],
  wallR:  [36, 49, 70],
  trim:   [68, 88, 118],
  navy:   [46, 60, 84],     // most of the furniture
  navyDk: [36, 48, 68],
  slate:  [92, 116, 148],
  pale:   [128, 150, 176],
  cream:  [224, 222, 212],
  grey:   [176, 186, 196],
  rug:    [132, 72, 30],
  rugDk:  [106, 56, 24],
  rugLt:  [160, 92, 40],
  rust:   [138, 76, 32],
  sofa:   [58, 74, 102],
  orange: [214, 128, 52],
  amber:  [240, 168, 84],
  lamp:   [255, 208, 120],
  wood:   [166, 122, 78],
  woodDk: [66, 44, 38],
  leaf:   [60, 136, 104],
  leafLt: [96, 180, 138],
  leafDk: [40, 96, 76],
  night:  [10, 14, 24],
  city:   [24, 32, 52],
  metal:  [82, 94, 110],
  red:    [150, 62, 50],
  tan:    [206, 170, 118],
};

/* — floor: tiles, then the rug — */
function floor() {
  // slab, so the front edges of the room have a lip
  box(0, 0, -0.35, RW, RD, 0.35, M.navyDk, { colTop: M.floor, top: 1, left: 0.9, right: 0.7 });
  // tile grid
  g.lineWidth = Math.max(1, 0.05 * BASE.tw * cam.z);
  g.strokeStyle = rgb(M.line);
  g.lineCap = 'butt';
  g.beginPath();
  for (let i = 0; i <= RW; i += 1) { const a = P(i, 0, 0), b = P(i, RD, 0); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); }
  for (let j = 0; j <= RD; j += 1) { const a = P(0, j, 0), b = P(RW, j, 0); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); }
  g.stroke();
  speckle(0, 0, RW, RD, 260, [34, 46, 64], 3, 0.05);
}

function rug() {
  const rx = 2.2, ry = 3.2, rw = 6.2, rd = 4.9;
  poly([[rx, ry, 0.02], [rx + rw, ry, 0.02], [rx + rw, ry + rd, 0.02], [rx, ry + rd, 0.02]], rgb(M.rug));
  // woven blocks
  for (let i = 0; i < 6; i++)
  for (let j = 0; j < 5; j++) {
    if ((i + j) & 1) continue;
    const x = rx + 0.25 + i * 0.95, y = ry + 0.25 + j * 0.95;
    poly([[x, y, 0.025], [x + 0.85, y, 0.025], [x + 0.85, y + 0.85, 0.025], [x, y + 0.85, 0.025]], rgb(M.rugDk));
  }
  // border
  g.lineWidth = Math.max(1, 0.08 * BASE.tw * cam.z);
  g.strokeStyle = rgb(M.rugLt);
  g.beginPath();
  [[rx + 0.12, ry + 0.12], [rx + rw - 0.12, ry + 0.12], [rx + rw - 0.12, ry + rd - 0.12], [rx + 0.12, ry + rd - 0.12]]
    .forEach(([x, y], i) => { const p = P(x, y, 0.03); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); });
  g.closePath(); g.stroke();
  speckle(rx, ry, rw, rd, 90, M.rugLt, 5, 0.045);
}

/* — the two walls, with their thickness showing at the top and the far ends — */
function walls() {
  box(-WT, -WT, 0, WT, RD + WT, WH, M.trim, { colRight: M.wallL, right: 1, colLeft: M.trim, left: 0.85, top: 1 });
  box(0, -WT, 0, RW, WT, WH, M.trim, { colLeft: M.wallR, left: 1, colRight: M.trim, right: 0.7, top: 1 });
  // faint blockwork on the left wall
  g.lineWidth = 1;
  g.strokeStyle = rgb([27, 37, 53]);
  g.beginPath();
  for (let z = 1; z < WH; z += 1) { const a = P(0, 0, z), b = P(0, RD, z); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); }
  for (let y = 1; y < RD; y += 1) { const a = P(0, y, 0), b = P(0, y, WH); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); }
  g.stroke();
  // skirting
  box(0, 0, 0, RW, 0.12, 0.3, M.navyDk, { left: 0.9 });
  box(0, 0, 0, 0.12, RD, 0.3, M.navyDk, { right: 0.9 });
}

/* — left wall: clock, wall shelf, little cabinet, poster, door — */
function leftWall(t) {
  // clock
  const cy = 1.9, cz = 7.9, r = 0.55;
  discX(-0.02, cy, cz, r + 0.1, rgb(M.slate));
  discX(-0.03, cy, cz, r, rgb(M.cream));
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * TAU;
    beam([-0.04, cy + Math.cos(a) * r * 0.82, cz + Math.sin(a) * r * 0.82],
         [-0.04, cy + Math.cos(a) * r * 0.7, cz + Math.sin(a) * r * 0.7], 0.04, M.navyDk, 1);
  }
  const hrs = (2 + 20 / 60) / 12 * TAU, mins = (20 / 60) * TAU;
  beam([-0.05, cy, cz], [-0.05, cy + Math.sin(hrs) * r * 0.45, cz + Math.cos(hrs) * r * 0.45], 0.06, M.navyDk, 1);
  beam([-0.05, cy, cz], [-0.05, cy + Math.sin(mins) * r * 0.66, cz + Math.cos(mins) * r * 0.66], 0.045, M.navyDk, 1);
  const secs = (t % 60) / 60 * TAU;
  beam([-0.06, cy, cz], [-0.06, cy + Math.sin(secs) * r * 0.7, cz + Math.cos(secs) * r * 0.7], 0.03, M.orange, 1);

  // wall shelf with a plant, right under the clock
  box(0, 0.75, 6.35, 0.7, 0.9, 0.1, M.navy, { top: 1.1 });
  cyl(0.38, 1.2, 6.45, 0.22, 0.3, M.navyDk, { n: 10, rt: 0.2, topK: 0.6 });
  fern(0.38, 1.2, 6.75, 0.55, 7, 41);

  // little open cabinet with a radio in it
  box(0, 1.45, 5.35, 0.75, 1.25, 0.08, M.navy, { top: 1.1 });          // bottom
  box(0, 1.45, 5.43, 0.75, 1.25, 0.62, M.navyDk, { top: 0.9, left: 0.9, right: 0.72 });
  rectX(0.76, 1.55, 5.48, 2.6, 5.98, rgb([22, 30, 44]));               // the dark inside
  box(0.08, 1.75, 5.44, 0.6, 0.7, 0.42, M.metal, { top: 1.1, right: 0.75 });
  discX(0.69, 2.2, 5.66, 0.08, rgb(M.orange), 8);

  // poster — mountain, in orange
  rectX(0.03, 3.5, 5.55, 5.15, 7.75, rgb(M.slate));
  rectX(0.04, 3.62, 5.67, 5.03, 7.63, rgb([24, 32, 48]));
  poly([[0.05, 3.85, 6.55], [0.05, 4.32, 7.3], [0.05, 4.8, 6.55]], rgb(M.orange));
  poly([[0.05, 4.32, 7.3], [0.05, 4.2, 7.1], [0.05, 4.44, 7.1]], rgb(M.cream));
  rectX(0.05, 3.9, 6.25, 4.75, 6.32, rgb(M.orange));
  rectX(0.05, 4.0, 6.05, 4.65, 6.12, rgb(M.orange));

  // door, with the frame proud of the wall
  const y0 = 10.9, dw = 2.4, H = 5.6;
  box(0, y0 - 0.18, 0, 0.16, dw + 0.36, H + 0.18, M.slate, { right: 0.9, top: 1, left: 0.8 });
  rectX(0.17, y0, 0, y0 + dw, H, rgb([22, 30, 44]));
  rectX(0.18, y0 + 0.25, 0.35, y0 + dw - 0.25, H - 0.35, rgb([26, 35, 50]));
  rectX(0.19, y0 + 0.4, 3.9, y0 + 1.5, 4.3, rgb(M.grey));            // name plate
  beam([0.2, y0 + dw - 0.55, 2.7], [0.2, y0 + dw - 0.3, 2.7], 0.07, M.grey, 1);   // handle
  rectX(0.19, y0 + 0.05, 0, y0 + dw - 0.05, 0.06, rgb([120, 150, 180]));        // hall light under it

  // door mat
  box(0.25, y0 - 0.05, 0, 2.0, dw + 0.1, 0.06, M.navy, { top: 0.95 });
  speckle(0.3, y0, 1.9, dw, 40, [70, 88, 118], 19, 0.045);
}

/** A little fan of leaves, used for every small plant in the room. */
function fern(px, py, z, len, n, seed) {
  const R = rnd(seed);
  const blades = [];
  for (let i = 0; i < n; i++) blades.push({ a: R() * TAU, l: len * (0.6 + R() * 0.5), w: 0.07 + R() * 0.05, k: 0.7 + R() * 0.5 });
  blades.sort((m, q) => (Math.cos(m.a) + Math.sin(m.a)) - (Math.cos(q.a) + Math.sin(q.a)));
  blades.forEach(b => {
    const mx = px + Math.cos(b.a) * b.l * 0.45, my = py + Math.sin(b.a) * b.l * 0.45;
    const tx = px + Math.cos(b.a) * b.l * 0.8, ty = py + Math.sin(b.a) * b.l * 0.8;
    beam([px, py, z], [mx, my, z + b.l * 0.7], b.w, M.leaf, b.k);
    beam([mx, my, z + b.l * 0.7], [tx, ty, z + b.l * 0.95], b.w * 0.8, M.leafLt, b.k);
  });
}

/* — right wall: the window, a strip light, a poster, a shelf — */
function rightWall(t) {
  // ── window, x 1.0 … 7.6, z 3.4 … 7.4
  const wx0 = 1.0, wx1 = 7.6, wz0 = 3.4, wz1 = 7.4;
  rectY(0.02, wx0, wz0, wx1, wz1, rgb(M.night));

  g.save();
  g.beginPath();
  [[wx0, wz0], [wx1, wz0], [wx1, wz1], [wx0, wz1]].forEach(([a, b], i) => {
    const p = P(a, 0.02, b); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]);
  });
  g.clip();

  // a city, asleep except for the odd window
  const R = rnd(7);
  let bx = wx0 - 0.3;
  while (bx < wx1) {
    const bw = 0.3 + R() * 0.5, bh = 0.6 + R() * 2.4;
    rectY(0.02, bx, wz0, bx + bw, wz0 + bh, rgb(M.city));
    const cols = Math.max(1, (bw / 0.16) | 0), rows = (bh / 0.22) | 0;
    for (let i = 0; i < cols; i++)
    for (let j = 0; j < rows; j++) {
      if (R() > 0.3) continue;
      const lx = bx + 0.05 + i * 0.16, lz = wz0 + 0.1 + j * 0.22;
      rectY(0.02, lx, lz, lx + 0.07, lz + 0.1, rgb(R() > 0.5 ? M.amber : M.orange));
    }
    bx += bw + 0.06;
  }

  // rain, running down the glass
  const RN = rnd(21);
  for (let i = 0; i < 70; i++) {
    const sx = wx0 + RN() * (wx1 - wx0);
    const speed = 2.0 + RN() * 2.5;
    const sz = wz1 - ((RN() * 5 + t * speed) % 5);
    const len = 0.25 + RN() * 0.5;
    beam([sx, 0.02, sz], [sx + 0.04, 0.02, sz + len], 0.035, [58, 90, 128], 1);

  // frame + mullion

  box(wx0 - fr, -0.14, wz1, wx1 - wx0 + fr * 2, 0.14, fr, M.trim, { left: 0.9 });
  box(wx0 - fr, -0.14, wz0, fr, 0.14, wz1 - wz0, M.trim, { left: 0.9 });
  box(wx1, -0.14, wz0, fr, 0.14, wz1 - wz0, M.trim, { left: 0.9 });
  box((wx0 + wx1) / 2 - 0.07, -0.1, wz0, 0.14, 0.1, wz1 - wz0, M.trim, { left: 0.9 });

  // ── strip light, high on the wall
  box(9.0, -0.02, 6.95, 2.9, 0.12, 0.2, M.navyDk, { top: 1 });
  rectY(0.11, 9.05, 6.98, 11.85, 7.12, rgb(M.amber));
  rectY(0.12, 9.15, 7.01, 11.75, 7.09, rgb([255, 236, 190]));

  // ── poster with a sun on it
  rectY(0.02, 9.4, 4.4, 10.85, 6.25, rgb(M.slate));
  rectY(0.03, 9.52, 4.52, 10.73, 6.13, rgb([24, 32, 48]));

  rectY(0.04, 9.7, 5.0, 10.55, 5.06, rgb(M.slate));
  rectY(0.04, 9.7, 4.85, 10.4, 4.91, rgb(M.slate));
  rectY(0.04, 9.7, 4.7, 10.5, 4.76, rgb(M.slate));

  // ── small wall speaker
  box(11.35, 0.02, 5.55, 0.5, 0.42, 0.7, M.navyDk, { left: 0.95, top: 1.1 });
  discY(11.6, 0.44, 5.78, 0.14, rgb(M.orange), 10);
  discY(11.6, 0.45, 5.78, 0.07, rgb(M.navyDk), 8);
  discY(11.6, 0.44, 6.08, 0.07, rgb(M.slate), 8);

  // ── wall shelf: books, a trailing plant
  box(11.2, 0, 4.3, 2.3, 0.75, 0.12, M.navy, { top: 1.15, left: 0.9 });
  box(11.35, 0.1, 4.42, 0.12, 0.5, 0.5, M.cream, { top: 0.9 });
  box(11.5, 0.1, 4.42, 0.14, 0.5, 0.45, M.orange, { top: 0.9 });
  box(11.67, 0.1, 4.42, 0.1, 0.5, 0.52, M.slate, { top: 0.9 });
  box(11.8, 0.1, 4.42, 0.13, 0.5, 0.4, M.grey, { top: 0.9 });
  box(12.0, 0.12, 4.42, 0.45, 0.45, 0.3, M.navyDk, { top: 0.9 });      // a small box
  cyl(12.95, 0.4, 4.42, 0.24, 0.32, M.navyDk, { n: 10, rt: 0.22, topK: 0.6 });

/** The lamp: base, stem, arm, shade. Everything warm in this room comes from here. */

  const lx = LAMPPOS.x, ly = LAMPPOS.y;

  cyl(lx, ly, T, 0.3, 0.09, M.navyDk, { n: 14, topK: 1.15 });
  beam([lx, ly, T + 0.08], [lx, ly, T + 1.6], 0.085, M.slate, 0.95);
  beam([lx, ly, T + 1.6], [hx, hy, hz + 0.42], 0.085, M.slate, 1.05);
  beam([hx, hy, hz + 0.42], [hx, hy, hz + 0.3], 0.07, M.slate, 0.9);
  // a lit rim peeks out from under the shade when the bulb is on
  if (LAMP > 0.05) disc(hx, hy, hz - 0.01, 0.63, rgb(mix(M.orange, M.lamp, LAMP)), 16);
  shade(hx, hy, hz, 0.55, 0.42, 0.2, M.navy);
}

/** A cone that is wider at the bottom than the top. All of it is
    visible from above, so every segment is drawn, back to front. */
function shade(cx, cy, z, r, h, rt, col) {
  const n = 16, segs = [];
  for (let i = 0; i < n; i++) {
    const am = (i + 0.5) / n * TAU;
    segs.push({ i, d: Math.cos(am) + Math.sin(am) });
  }
  segs.sort((a, b) => a.d - b.d);
  segs.forEach(({ i, d }) => {
    const a0 = i / n * TAU, a1 = (i + 1) / n * TAU;
    const k = 0.55 + 0.45 * clamp(d / 1.414 * 0.5 + 0.5, 0, 1);
    poly([
      [cx + r  * Math.cos(a0), cy + r  * Math.sin(a0), z],
      [cx + r  * Math.cos(a1), cy + r  * Math.sin(a1), z],
      [cx + rt * Math.cos(a1), cy + rt * Math.sin(a1), z + h],
      [cx + rt * Math.cos(a0), cy + rt * Math.sin(a0), z + h],
    ], sh(col, k));
  });
  disc(cx, cy, z + h, rt, sh(col, 1.1), n);
}

  beam([x0 + 0.8 + Math.cos(spin) * 0.1, y0 + 0.72 + Math.sin(spin) * 0.1, H + 0.2],
       [x0 + 0.8 + Math.cos(spin) * 0.38, y0 + 0.72 + Math.sin(spin) * 0.38, H + 0.2], 0.03, [36, 46, 62], 1);
  beam([x0 + 1.4, y0 + 0.3, H + 0.3], [x0 + 1.05, y0 + 0.75, H + 0.24], 0.05, M.grey, 1);     // tone arm
  cyl(x0 + 1.4, y0 + 0.3, H + 0.14, 0.08, 0.18, M.metal, { n: 8 });

  // the other speaker, on the console
  box(x0 + 2.05, y0 + 0.3, H, 0.85, 0.85, 1.15, M.navyDk, { top: 1.05, left: 0.95, right: 0.7 });
  discY(x0 + 2.47, y0 + 1.16, H + 0.42, 0.22, rgb(M.orange), 12);
  discY(x0 + 2.47, y0 + 1.17, H + 0.42, 0.12, rgb(M.navyDk), 10);
  discY(x0 + 2.47, y0 + 1.16, H + 0.9, 0.1, rgb(M.orange), 8);

  // snake plant, beside the desk
  cyl(8.6, 0.85, 0, 0.5, 0.95, M.navyDk, { n: 14, rt: 0.42, topK: 0.55 });
  const S = rnd(83);
  const leaves = [];
  for (let i = 0; i < 11; i++) leaves.push({ a: S() * TAU, l: 1.6 + S() * 1.4, o: 0.1 + S() * 0.25, w: 0.1 + S() * 0.06 });
  leaves.sort((m, q) => (Math.cos(m.a) + Math.sin(m.a)) - (Math.cos(q.a) + Math.sin(q.a)));
  leaves.forEach((L, i) => {
    const ox = Math.cos(L.a) * L.o, oy = Math.sin(L.a) * L.o;
    const c = i % 3 === 0 ? M.leafLt : M.leaf;
    beam([8.6 + ox, 0.85 + oy, 0.9], [8.6 + ox * 2.2, 0.85 + oy * 2.2, 0.9 + L.l * 0.7], L.w, c, 0.95);
    beam([8.6 + ox * 2.2, 0.85 + oy * 2.2, 0.9 + L.l * 0.7], [8.6 + ox * 2.6, 0.85 + oy * 2.6, 0.9 + L.l], L.w * 0.6, c, 1.1);
  });
}

/* — coffee table on the rug: laptop, a mug — */

  [[x0 + 0.08, y0 + 0.08], [x0 + w - 0.2, y0 + 0.08], [x0 + 0.08, y0 + d - 0.2], [x0 + w - 0.2, y0 + d - 0.2]]
    .forEach(([lx, ly]) => box(lx, ly, 0, 0.12, 0.12, H, M.navyDk, { top: 0.9 }));
  box(x0, y0, H, w, d, 0.12, M.navy, { top: 1.15, right: 0.66 });
  box(x0 + 0.35, y0 + 0.25, H + 0.12, 1.0, 0.78, 0.08, M.navyDk, { top: 1.12 });    // laptop, closed
  disc(x0 + 0.85, y0 + 0.64, H + 0.21, 0.07, rgb(M.slate), 8);
  cyl(x0 + 2.05, y0 + 0.62, H + 0.12, 0.16, 0.3, M.navyDk, { n: 10, topK: 0.55 });  // mug
  beam([x0 + 2.21, y0 + 0.62, H + 0.22], [x0 + 2.32, y0 + 0.62, H + 0.3], 0.05, M.navyDk, 1.1);
  beam([x0 + 2.32, y0 + 0.62, H + 0.3], [x0 + 2.21, y0 + 0.62, H + 0.38], 0.05, M.navyDk, 1.1);
}

/* — couch, with a throw over one arm — */
function couch() {
  const x0 = 4.2, y0 = 8.5, w = 4.4, d = 1.9;

  box(x0 + 0.42, y0 + 0.15, 0.55, (w - 0.9) / 2, 1.2, 0.4, M.sofa, { top: 1.08 });
  box(x0 + 0.48 + (w - 0.9) / 2, y0 + 0.15, 0.55, (w - 0.9) / 2, 1.2, 0.4, M.sofa, { top: 1.08 });
  box(x0, y0 + d - 0.55, 0.55, w, 0.55, 1.2, M.sofa, { top: 1.1, left: 0.85, right: 0.62 });  // back
  box(x0, y0, 0.55, 0.42, d, 0.78, M.sofa, { top: 1.12, left: 0.85 });                          // arms
  box(x0 + w - 0.42, y0, 0.55, 0.42, d, 0.78, M.sofa, { top: 1.12, left: 0.85 });
  // the throw

        [x0 + w + 0.01, y0 + 1.6, 0.3], [x0 + w + 0.01, y0 + 0.35, 0.3]], sh(M.orange, 0.66));
  for (let i = 0; i < 4; i++) {
    beam([x0 + w + 0.02, y0 + 0.5 + i * 0.3, 1.35], [x0 + w + 0.02, y0 + 0.5 + i * 0.3, 0.4], 0.035, M.rust, 1);
  }

/* — storage chest by the front edge, books on it, a plant beside it — */
function chest() {
  box(11.9, 6.3, 0, 1.85, 1.35, 1.0, M.navyDk, { top: 1.02 });
  box(11.84, 6.24, 0.98, 1.97, 1.47, 0.12, M.navy, { top: 1.12 });
  box(12.1, 6.45, 1.1, 0.9, 0.16, 0.66, M.orange, { top: 0.92, right: 0.68 });
  box(12.1, 6.63, 1.1, 0.9, 0.14, 0.72, M.cream, { top: 0.92, right: 0.72 });
  box(12.1, 6.79, 1.1, 0.9, 0.2, 0.6, M.slate, { top: 0.92, right: 0.68 });
  box(12.1, 7.03, 1.1, 0.9, 0.45, 0.1, M.navyDk, { top: 1.1 });

  cyl(11.4, 8.6, 0, 0.36, 0.5, M.navyDk, { n: 12, rt: 0.3, topK: 0.6 });

/* ─────────────────────────────────────────────
   5. LIGHT
   Drawn in screen space and added on top. The
   quantiser then steps the smooth falloff into
   rings of ink, which is what makes it pixel art.
   ───────────────────────────────────────────── */
function glow(x, y, z, radius, col, strength) {
  if (strength <= 0.002) return;
  const p = P(x, y, z);
  const r = radius * BASE.tw * cam.z;
  const grd = g.createRadialGradient(p[0], p[1], 0, p[0], p[1], r);
  grd.addColorStop(0,    'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + strength + ')');
  grd.addColorStop(0.45, 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + strength * 0.35 + ')');
  grd.addColorStop(1,    'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0)');
  g.fillStyle = grd;
  g.fillRect(p[0] - r, p[1] - r, r * 2, r * 2);
}

function lighting(t, flicker) {
  g.globalCompositeOperation = 'lighter';
  const [hx, hy, hz] = LAMPPOS.head;
  const f = (0.9 + flicker * 0.1) * LAMP;

  // the lamp: a pool on the desk, a wash up the wall, a wide warm ambient
  glow(hx + 0.5, hy + 0.5, DESK.top, 3.4, [255, 200, 120], 0.42 * f);
  glow(hx, hy, hz, 1.1, [255, 235, 190], 0.6 * f);
  glow(hx, hy, hz - 0.6, 8.5, [230, 150, 70], 0.2 * f);
  glow(4.4, 3.0, 0, 6.0, [220, 140, 60], 0.09 * f);

  // strip light
  glow(10.4, 0, 6.9, 3.4, [240, 160, 80], 0.13);
  glow(10.4, 0, 6.9, 1.2, [255, 200, 130], 0.16);

  // monitor
  glow(DESK.x0 + 3.35, 0.9, DESK.top + 1.3, 1.7, [80, 140, 220], 0.1);

  // the city, through the glass — and a little more of it when the lamp is off
  glow(4.3, 0, 5.4, 4.6, [70, 110, 170], 0.05 + 0.06 * (1 - LAMP));
  // hall light under the door
  glow(0.3, 11.8, 0.05, 1.9, [170, 195, 230], 0.08);

  g.globalCompositeOperation = 'source-over';
}

/* ─────────────────────────────────────────────
   6. COMPOSITE, INPUT, LOOP
   ───────────────────────────────────────────── */
const view = document.getElementById('stage');
const stateEl = document.getElementById('state');

const PIXEL = 3;                      // css px per rendered px — the chunkiness dial
const buf = document.createElement('canvas');
const bctx = buf.getContext('2d', { willReadFrequently: true });
const vctx = view.getContext('2d');

let iw = 0, ih = 0;
let lampOn = true, lampTarget = 1;
let hot = false;

function fit() {
  const w = view.clientWidth || 800, h = view.clientHeight || 600;
  iw = Math.max(160, Math.round(w / PIXEL));
  ih = Math.max(120, Math.round(h / PIXEL));
  buf.width = iw; buf.height = ih;
  view.width = iw; view.height = ih;
  view.style.width = w + 'px'; view.style.height = h + 'px';
  home();
}

function home() {
  // frame the whole room, walls and all, with a little air around it
  const roomW = (RW + RD + 2 * WT) * BASE.tw;
  const top = -(2 * WT) * BASE.th - WH * BASE.tz;
  const bottom = (RW + RD) * BASE.th + 0.35 * BASE.tz;
  cam.z = Math.min(iw / (roomW + 24), ih / (bottom - top + 24));
  cam.x = iw / 2;
  cam.y = ih / 2 - (top + bottom) / 2 * cam.z;
}

function frame(ms) {
  const t = ms / 1000;
  const flicker = Math.sin(t * 9.3) * Math.sin(t * 2.7) * 0.5 + 0.5;

  LAMP += (lampTarget - LAMP) * 0.12;
  if (Math.abs(lampTarget - LAMP) < 0.005) LAMP = lampTarget;
  g = bctx;

  g.fillStyle = rgb(INK[0]);
  g.fillRect(0, 0, iw, ih);

  floor();
  rug();
  walls();
  leftWall(t);
  rightWall(t);
  bed();
  desk(t);
  nightstand();
  hifi(t);
  chair();
  bookshelf();
  coffeeTable();
  couch();
  chest();
  lighting(t, flicker);

  const snap = bctx.getImageData(0, 0, iw, ih);
  ditherToInks(snap, iw, ih, 8);
  vctx.putImageData(snap, 0, 0);
}

/* input — the lamp is the only thing in the room you can touch */
function overLamp(cx, cy) {
  const bx = cx * iw / (view.clientWidth || iw * PIXEL), by = cy * ih / (view.clientHeight || ih * PIXEL);
  const head = P(LAMPPOS.head[0], LAMPPOS.head[1], LAMPPOS.head[2] + 0.1);
  const r = 0.75 * BASE.tw * cam.z;
  if ((bx - head[0]) ** 2 + (by - head[1]) ** 2 < r * r) return true;
  // the stem
  const a = P(LAMPPOS.x, LAMPPOS.y, DESK.top + 0.2), b = P(LAMPPOS.x, LAMPPOS.y, DESK.top + 1.8);
  const t = clamp(((bx - a[0]) * (b[0] - a[0]) + (by - a[1]) * (b[1] - a[1])) / ((b[0] - a[0]) ** 2 + (b[1] - a[1]) ** 2 || 1), 0, 1);
  const qx = a[0] + (b[0] - a[0]) * t, qy = a[1] + (b[1] - a[1]) * t;
  return (bx - qx) ** 2 + (by - qy) ** 2 < (0.3 * BASE.tw * cam.z) ** 2;
}

function toggleLamp() {
  lampOn = !lampOn;
  lampTarget = lampOn ? 1 : 0;
  stateEl.textContent = lampOn ? 'lamp on' : 'lamp off';
}

view.addEventListener('pointermove', e => {
  const r = view.getBoundingClientRect();
  const h = overLamp(e.clientX - r.left, e.clientY - r.top);
  if (h !== hot) { hot = h; view.classList.toggle('hot', hot); }
});
view.addEventListener('pointerleave', () => { hot = false; view.classList.remove('hot'); });
view.addEventListener('pointerdown', e => {
  const r = view.getBoundingClientRect();
  if (overLamp(e.clientX - r.left, e.clientY - r.top)) toggleLamp();
});
view.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ' || e.key.toLowerCase() === 'l') { toggleLamp(); e.preventDefault(); }
});

/* loop — capped, and honest about reduced motion */
const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = 0;
function loop(ms) {
  if (ms - last > 33) { frame(still ? 4200 : ms); last = ms; }
  requestAnimationFrame(loop);
}

addEventListener('resize', fit);
fit();
requestAnimationFrame(loop);

/* exposed so tools/preview.js can render a frame outside the browser */
globalThis.QH = { frame, fit, cam, home, ditherToInks, INK,
                  setLamp: on => { lampOn = on; lampTarget = on ? 1 : 0; LAMP = lampTarget; },
                  setLights: on => { lampOn = on; lampTarget = on ? 1 : 0; LAMP = lampTarget; } };
})();
</script>
